{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}send money{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">send money</h2>
                <p class="text-muted small">amount is in your currency ({{ user.currency }}). it'll be converted for the recipient.</p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-success w-100">pay</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">register</h2>
                <p class="text-muted small">you'll start with the equivalent of £500 in your chosen currency</p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100">create account</button>
                </form>

                <p class="mt-3 small">already have an account? <a href="{% url 'login' %}">login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
